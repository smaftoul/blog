<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Brume decorative fog illustration</title>
  <desc id="desc">A soft foggy gradient with subtle glowing circles.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f14" />
      <stop offset="50%" stop-color="#141720" />
      <stop offset="100%" stop-color="#1a1f2e" />
    </linearGradient>
    <radialGradient id="mistA" cx="30%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mistB" cx="75%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)" />
  <circle cx="360" cy="170" r="190" fill="url(#mistA)" />
  <circle cx="980" cy="160" r="230" fill="url(#mistB)" />
  <ellipse cx="700" cy="250" rx="440" ry="80" fill="#ffffff" opacity="0.05" />
</svg>
